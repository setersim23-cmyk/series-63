name: Deploy

# Builds the app and publishes it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 40 MB of narration is rendered here rather than committed, so the repo
      # stays small. The cache key is the narration's inputs, so it re-renders
      # only when the content or the generator actually changes.
      - name: Cache narration audio
        id: audio
        uses: actions/cache@v4
        with:
          path: public/audio
          key: audio-v1-${{ hashFiles('src/content/textbook.ts', 'src/data/frames.ts', 'scripts/build_audio.py') }}

      - name: Render narration
        if: steps.audio.outputs.cache-hit != 'true'
        run: |
          pip install --quiet lameenc
          python3 scripts/build_audio.py

      - run: npm run build
        env:
          # Pages serves a project site from /<repo>/, so the app is built for that path.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
